[project]
name = "decision-one-pager"
version = "0.1.0"
description = "Decision One-Pager Engine v0 — generate a six-heading Chinese decision memo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
decision-one-pager = "decision_one_pager.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decision_one_pager*"]
